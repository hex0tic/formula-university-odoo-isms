events {}
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 100m;
        # Only the public CA certificate is downloadable. Private keys stay private.
        location = /formula-university-lan-ca.crt {
            alias /etc/nginx/tls/ca.crt;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="FormulaUniversity_LAN_CA.crt"';
        }
        location / {
            set $odoo_backend odoo:8069;
            proxy_pass http://$odoo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 720s;
            proxy_send_timeout 720s;
            proxy_buffering off;
        }
    }
}
