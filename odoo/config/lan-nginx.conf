events {}
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Count only admissions form submissions. Keys use the direct peer IP;
    # forwarded headers supplied by a client cannot change these limits.
    map "$request_method:$uri" $admission_submit_ip {
        default "";
        "POST:/university/admissions/apply" $binary_remote_addr;
        "POST:/university/admissions/inquiry" $binary_remote_addr;
    }
    map "$request_method:$uri" $admission_submit_site {
        default "";
        "POST:/university/admissions/apply" "admission-writes";
        "POST:/university/admissions/inquiry" "admission-writes";
    }
    map "$request_method:$uri" $admission_status_ip {
        default "";
        "POST:/university/admissions/status" $binary_remote_addr;
    }
    limit_req_zone $admission_submit_ip zone=admission_submit_ip:2m rate=6r/m;
    limit_req_zone $admission_submit_site zone=admission_submit_site:1m rate=60r/m;
    limit_req_zone $admission_status_ip zone=admission_status_ip:2m rate=15r/m;
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 100m;
        # Only the public CA certificate is downloadable. Private keys stay private.
        location = /formula-university-lan-ca.crt {
            alias /etc/nginx/tls/ca.crt;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="FormulaUniversity_LAN_CA.crt"';
        }
        location / {
            limit_req zone=admission_submit_ip burst=8 nodelay;
            limit_req zone=admission_submit_site burst=30 nodelay;
            limit_req zone=admission_status_ip burst=12 nodelay;
            limit_req_status 429;
            error_page 429 = @admissions_rate_limit;
            set $odoo_backend odoo:8069;
            proxy_pass http://$odoo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 720s;
            proxy_send_timeout 720s;
            proxy_buffering off;
        }
        location @admissions_rate_limit {
            default_type "text/plain; charset=utf-8";
            add_header Retry-After 10 always;
            add_header Cache-Control "no-store" always;
            return 429 "Хэт олон хүсэлт илгээлээ. Түр хүлээгээд дахин оролдоно уу.";
        }
    }
}
